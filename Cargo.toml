[package]
name = "tsuru"
version = "0.2.0"
edition = "2024"
description = "High-throughput KRX MDF (KOSPI200 B6034) PCAP quote parser"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false
